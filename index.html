<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu ❤️</title>
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-pink-50 flex flex-col items-center justify-center min-h-screen overflow-hidden font-sans text-center relative">
    
    <h1 id="mainText" class="text-4xl font-bold text-pink-500 mb-2 mt-8 z-10 transition-all duration-500">Maafin aku yaaaa</h1>
    <p id="subText" class="text-pink-400 mb-6 z-10">Sowwyyy yaaa aku slr dan respon ku kurang bagus</p>

    <!-- Area Buket SVG -->
    <svg id="bouquet" viewBox="0 0 200 300" class="w-64 h-96 z-10 overflow-visible">
        
        <g id="stemsGroup">
            <line x1="100" y1="110" x2="100" y2="180" stroke="#4ade80" stroke-width="3"></line>
        </g>
        
        <!-- Pembungkus Buket -->
        <path d="M 60 160 L 140 160 L 110 260 L 90 260 Z" fill="#fbcfe8" stroke="#f9a8d4" stroke-width="2"/>
        <path d="M 60 160 Q 100 180 140 160" fill="none" stroke="#f9a8d4" stroke-width="2"/>
        
        <path d="M 85 200 Q 100 220 115 200 Q 100 190 85 200 Z" fill="#ec4899"/>
        <path d="M 100 210 L 80 250 L 95 245 Z" fill="#db2777"/>
        <path d="M 100 210 L 120 250 L 105 245 Z" fill="#db2777"/>

        <g id="flowersGroup">
            <!-- Bunga Pertama (Tengah) -->
            <!-- Grup luar menahan posisi koordinat agar tidak hilang -->
            <g transform="translate(100, 110)">
                <!-- Grup dalam khusus untuk efek animasi mekar -->
                <g class="flower">
                    <circle cx="0" cy="-15" r="10" fill="#f472b6" class="petal"/>
                    <circle cx="15" cy="-5" r="10" fill="#f472b6" class="petal"/>
                    <circle cx="10" cy="12" r="10" fill="#f472b6" class="petal"/>
                    <circle cx="-10" cy="12" r="10" fill="#f472b6" class="petal"/>
                    <circle cx="-15" cy="-5" r="10" fill="#f472b6" class="petal"/>
                    <circle cx="0" cy="0" r="8" fill="#fbbf24"/>
                </g>
            </g>
        </g>
    </svg>

    <button id="actionBtn" class="mt-8 bg-pink-400 hover:bg-pink-500 text-white font-bold py-3 px-6 rounded-full shadow-lg transform transition hover:scale-105 z-10">
        Putar Lagu & Maafin!
    </button>

    <audio id="bgMusic" src="love.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
